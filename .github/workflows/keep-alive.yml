name: Supabase Keep-Alive Ping

on:
  schedule:
    - cron: '0 0 */3 * *' # Pings every 3 days to prevent 7-day free-tier pause
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Keep-Alive Endpoint
        run: |
          if [ -n "${{ secrets.DEPLOYED_APP_URL }}" ]; then
            curl -fsS "${{ secrets.DEPLOYED_APP_URL }}/api/keep-alive" || echo "Ping failed"
          else
            echo "DEPLOYED_APP_URL secret is not set. Please set it in repository settings."
          fi
